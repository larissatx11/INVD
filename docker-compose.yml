version: "3.8"

services:
  api_colmeia:
    build: ./api_simulador
    ports:
      - "8000:8000"
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"

  ingest_api:
    build: ./ingest
    command: python consumer_api.py
    volumes:
      - ./ingest/json:/app/ingest/json
      - ./ingest/csv:/app/ingest/csv
    depends_on:
      - api_colmeia
      - kafka
      - minio
    restart: unless-stopped

  ingest_db:
    build: ./ingest_db
    command: python consumer_db.py
    volumes:
      - ./ingest_db/saida:/app/saida
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: colmeia
    depends_on:
      - api_colmeia
      - mysql
    restart: unless-stopped

  exportador_json:
    build: ./ingest_db
    command: python exportador_json.py
    volumes:
      - ./ingest_db/saida:/app/saida
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: colmeia
    depends_on:
      - api_colmeia
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: colmeia
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  akhq:
    image: tchiotludo/akhq
    container_name: akhq
    ports:
      - "8081:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          server:
            servlet:
              context-path: /
          connections:
            kafka-cluster:
              properties:
                bootstrap.servers: "kafka:9092"
    depends_on:
      - kafka

  processing_csv_kafka:
    build: ./datalake/processing_csv
    command: python3 consumer_transform_csv.py
    depends_on:
      - kafka
      - minio
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: dados_csv
    volumes:
      - ./datalake/processing_csv/saida:/app/processing_csv/saida
    restart: unless-stopped

  processing_json_kafka:
    build: ./datalake/processing_json
    command: python consumer_transform_json.py
    depends_on:
      - kafka
      - minio
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: dados_json
    volumes:
      - ./datalake/processing_json/saida:/app/processing_json/saida
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.9.1
    container_name: airflow
    ports:
      - "8080:8080"
    command: airflow webserver
    depends_on:
      - kafka
      - mysql
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./ingest:/opt/airflow/ingest
      - ./ingest_db:/opt/airflow/ingest_db
      - ./datalake/processing_csv:/opt/airflow/processing_csv
      - ./datalake/processing_json:/opt/airflow/processing_json
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    working_dir: /opt/airflow

  airflow_scheduler:
    image: apache/airflow:2.9.1
    container_name: airflow_scheduler
    command: airflow scheduler
    depends_on:
      - airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./ingest:/opt/airflow/ingest
      - ./ingest_db:/opt/airflow/ingest_db
      - ./datalake/processing_csv:/opt/airflow/processing_csv
      - ./datalake/processing_json:/opt/airflow/processing_json
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db

  airflow-cli:
    image: apache/airflow:2.9.1
    container_name: airflow_cli
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    working_dir: /opt/airflow
    entrypoint: ""
    command: bash

volumes:
  mysql-data:
  minio_data:
